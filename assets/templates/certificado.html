<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Certificado</title>
    <style>
        body { font-family: "Helvetica", "Arial", sans-serif; font-size: 14px; line-height: 1.5; color: #333; text-align: center; }
        h1 { color: #2c5c36; font-size: 28px; margin-top: 50px; }
        h2 { font-size: 20px; color: #444; margin-top: 25px; }
        p { font-size: 16px; margin: 20px 40px; }
    </style>
</head>
<body>
    <h1>Certificado de Participación</h1>
    <h2>{{site_name}}</h2>
    
    <p>Por la presente certifica que</p>
    
    <h3 style="font-size: 24px; color: #2c5c36;">{{nombre}}</h3>
    <p>con DNI/NIE {{dni}}</p>
    
    <p>Ha participado activamente en:</p>
    <h3 style="font-size: 18px;">{{actividad}}</h3>
    <p>Fecha: {{fecha}}</p>

    <!-- FIRMA DIGITAL SERÁ AÑADIDA POR LA CLASE BDV_Signature -->
</body>
</html>
